# 中科国瓷 — default site for bare IP 150.158.42.39 until domain DNS is ready.
# HTTP + HTTPS both serve the Chinese site so browsers that force HTTPS no longer hit cosgo's dead upstream (502).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kdgc.cc www.kdgc.cc 150.158.42.39 _;

    root /opt/kdgc-growth/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static cache
    location ~* \.(js|css|png|jpg|jpeg|webp|avif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy CRM path
    location /crm/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    # SEO files
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # HTML pages — do NOT fall back to homepage
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}

# HTTPS default for IP access (self-signed until Let's Encrypt after DNS)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name kdgc.cc www.kdgc.cc 150.158.42.39 _;

    ssl_certificate     /etc/nginx/ssl/kdgc-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/kdgc-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/kdgc-growth/frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
