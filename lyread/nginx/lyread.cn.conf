limit_req_zone $binary_remote_addr zone=lyread_api:10m rate=10r/s;

map $http_user_agent $lyread_is_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*duckduckbot 1;
    ~*slurp 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*applebot 1;
    ~*petalbot 1;
    ~*sogou 1;
    ~*360spider 1;
    # GEO / 生成式引擎爬虫（与 robots.txt Allow 对齐）
    ~*gptbot 1;
    ~*chatgpt-user 1;
    ~*claudebot 1;
    ~*claude-web 1;
    ~*perplexitybot 1;
    ~*bytespider 1;
    ~*google-extended 1;
}

map "$lyread_is_bot:$arg_ssr" $lyread_ssr_page {
    default 0;
    "~^1:" 1;
    "~:1$" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name lyread.cn www.lyread.cn;
    return 301 https://lyread.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lyread.cn www.lyread.cn;

    ssl_certificate /etc/letsencrypt/live/lyread.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyread.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://hm.baidu.com https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://hm.baidu.com https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 静态图：禁止回退 SPA index.html（否则缺失 OG 图也会 200 text/html）
    location ^~ /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=lyread_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(behavior|hot|evolution|scheduler|seo)/ {
        limit_req zone=lyread_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # P1: 营销页 SSR（爬虫与 ?ssr=1 预览；普通用户仍走 Vue SPA）
    # 首页：后端 JSON 占用 GET /，爬虫反代到 /ssr/home
    location = / {
        error_page 418 = @home_ssr;
        if ($lyread_ssr_page) { return 418; }
        try_files $uri /index.html;
    }
    location @home_ssr {
        proxy_pass http://127.0.0.1:8004/ssr/home;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=600" always;
    }

    location = /pricing {
        error_page 418 = @pricing_ssr;
        if ($lyread_ssr_page) { return 418; }
        try_files $uri /index.html;
    }
    location @pricing_ssr {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=1800" always;
    }

    location = /trending {
        error_page 418 = @trending_ssr;
        if ($lyread_ssr_page) { return 418; }
        try_files $uri /index.html;
    }
    location @trending_ssr {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=600" always;
    }

    # 短故事匿名预览落地页：爬虫 / ?ssr=1 走后端 HTML，人类仍用 Vue ShortStory
    # 尾斜杠统一到裸 /story，避免 SPA 壳绕过 bot SSR（对齐 /ep）
    location = /story/ {
        return 301 /story$is_args$args;
    }
    location = /story {
        error_page 418 = @story_ssr;
        if ($lyread_ssr_page) { return 418; }
        try_files $uri /index.html;
    }
    location @story_ssr {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=600" always;
    }

    # 案例阅读 SPA 路径：爬虫 / ?ssr=1 走后端 HTML（canonical=/ep/:id），人类仍用 Vue CaseReader
    location ~ ^/case/[0-9]+$ {
        error_page 418 = @case_ssr;
        if ($lyread_ssr_page) { return 418; }
        try_files $uri /index.html;
    }
    location @case_ssr {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=600" always;
    }

    # /ep/:id 与 /case/:id 对齐：人类 SPA CaseReader；爬虫 / ?ssr=1 走 SSR
    # 生产若仍 301 /case→/ep，硬刷新/分享落到 /ep 后仍可打开阅读器
    location ~ ^/ep/[0-9]+$ {
        error_page 418 = @ep_case_ssr;
        if ($lyread_ssr_page) { return 418; }
        try_files $uri /index.html;
    }
    location ~ ^/ep/([0-9]+)/$ {
        return 301 /ep/$1$is_args$args;
    }
    location @ep_case_ssr {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=600" always;
    }

    # /ep 索引始终 SSR（避免裸 /ep 301→/ep/ 后再 HEAD 405）
    location = /ep {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /ep/ {
        return 301 /ep$is_args$args;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # GEO：LLM 站点说明
    location = /llms.txt {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=1800" always;
    }

    # SEO：FAQ / 关于 / 隐私 / 协议（完整刷新始终 SSR；站内 router-link 可进 SPA 次屏 CTA）
    location = /faq {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /about {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /privacy {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /terms {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # SEO 内容集群：对比 / 教程 / 题材聚合（始终 SSR，禁止回退 SPA）
    location ~ ^/(compare|guide|genre)(/|$) {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ ^/health(?:/|$) {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
