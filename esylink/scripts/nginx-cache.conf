# Nginx static asset cache headers for esylink.cn
# Insert inside HTTPS server block for esylink.cn

    # Static asset caching (P2 CDN optimization)
    location ~* \.(css|js|webp|woff2?|svg|ico|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /resources/ai-outbound-guide.html {
        try_files /resources/ai-outbound-guide.html =404;
    }
