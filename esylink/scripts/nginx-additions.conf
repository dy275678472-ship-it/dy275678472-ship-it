# Nginx additions for esylink.cn — append to /etc/nginx/conf.d/esylink.conf

# === P0: 断链 301 修复 ===
location = /haoma.html { return 301 /pricing; }
location = /cs.html    { return 301 /cs/; }
location = /cases.html { return 301 /cases/; }

# === P1: 新页面路由 ===
location = /trust/       { try_files /trust/index.html =404; }
location = /compliance/  { try_files /compliance/index.html =404; }
location = /legal/       { try_files /legal/index.html =404; }

# === P2: CDN 缓存强化 ===
location ~* \.(webp|png|jpg|jpeg|gif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
