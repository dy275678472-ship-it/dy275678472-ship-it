# esnlink.cn performance & SEO isolation
# Deploy: sudo cp to /etc/nginx/snippets/esnlink-performance.conf
# Include in server block: include snippets/esnlink-performance.conf;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml image/svg+xml;

# Static asset caching
location ~* \.(css|js|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}
